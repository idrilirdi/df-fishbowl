# df_fishbowl configuration
# Sourced as shell by bin/df_fishbowl. Override any value here.
# A user copy is searched for first at $XDG_CONFIG_HOME/df_fishbowl/config
# (or ~/.config/df_fishbowl/config); this file is the shipped default.

# --- Dwarf Fortress install ---
# Root of the extracted DF tree (contains the `dfhack` / `dfhack-run` launchers).
DF_HOME="${DF_HOME:-$HOME/DwarfFortressFishbowl/df_linux}"

# df-ai writes its narration here (df-ai.json -> write_log:true).
LOG_FILE="${LOG_FILE:-$DF_HOME/df-ai.log}"

# --- Behaviour ---
# tmux session name holding the running DF process.
SESSION="${SESSION:-df_fishbowl}"

# Terminal emulator used to display the fortress / log. See the README's
# "Terminals" table for details. Summary (Wayland/swaylock-plugin backend):
#   havoc     - works with an unpatched swaylock-plugin (single wl_shm surface).
#   foot      - needs swaylock-plugin PR#2 (wl_subcompositor + wl_seat). Default.
#   alacritty - needs swaylock-plugin PR#2 (wl_subcompositor).
#   kitty     - DANGEROUS: its GL/EGL init crashes swaylock-plugin's compositor,
#               which ABANDONS the lock (sway shows its red screen). Do not use.
# All terminals additionally need swaylock-plugin PR#1 (surface letterboxing).
# X11 backend: use an X terminal that can embed into a window (xterm, urxvt, st).
# With foot the mirrored fortress is padded to a shared grid and centered across
# differently-sized screens (see MIRROR_SIZE); other terminals just fill.
TERMINAL="${TERMINAL:-foot}"

# Font for DF's FORTRESS terminal only, applied per-invocation (your global
# terminal config is untouched, and the log keeps its default font). DF in TEXT
# mode draws with the terminal font, so a SQUARE font renders its CP437 map with
# correct proportions — a normal 1:2 monospace looks vertically stretched.
# `unscii` (unscii-8: square, public domain, CP437 + semigraphics) is a great
# fit; install.sh offers to fetch it, or install it by hand:
#   mkdir -p ~/.local/share/fonts &&
#   curl -fsSLo ~/.local/share/fonts/unscii-8.ttf http://viznut.fi/unscii/unscii-8.ttf &&
#   fc-cache -f
# foot honors this; empty = the terminal's default font. Missing glyphs fall
# back to the system font. (kitty also reads it, but do not use kitty — above.)
FORTRESS_FONT="${FORTRESS_FONT:-unscii}"
# Point size for FORTRESS_FONT (empty = terminal default).
FORTRESS_FONT_SIZE="${FORTRESS_FONT_SIZE:-}"

# Percent chance (0-100) that a *new* fortress is generated instead of loading
# a random existing save.
NEW_FORT_CHANCE="${NEW_FORT_CHANCE:-10}"

# Saved fortresses whose folder is older than this many days are deleted before
# a new session starts (the special `current` folder is always kept).
SAVE_MAX_AGE_DAYS="${SAVE_MAX_AGE_DAYS:-30}"

# single = one DF process shared (mirrored) across all horizontal outputs.
# multi  = one independent DF process per horizontal output.
FORTRESS_MODE="${FORTRESS_MODE:-single}"

# Role assignment: portrait outputs show the log, landscape ones the fortress,
# and a lone output is always the fortress. When this is 1 and there is NO
# portrait output but two or more landscape ones, the smallest landscape shows
# the log and the larger ones the fortress. Set to 0 to make every landscape
# output a fortress in that case.
LOG_ON_SMALLER_HORIZONTAL="${LOG_ON_SMALLER_HORIZONTAL:-1}"

# Shared tmux grid for the mirrored fortress (FORTRESS_MODE=single):
#   smallest = session = the smallest screen's grid; nothing is ever cut off, and
#              a screen with a slightly larger grid shows a thin filler-dot band.
#   largest  = session = the biggest screen's grid; it fills, smaller screens are
#              cut off (clipped) on the missing rows/columns.
# `smallest` is the default because losing content (clipping) is worse than a few
# filler dots. With TERMINAL=foot the fortress is padded/centered to the largest
# rectangle common to all fortress outputs, so outputs differing only by scale
# end up within a cell or two. (Use FORTRESS_MODE=multi for an independent,
# natively-full fortress per screen with no shared grid at all.)
MIRROR_SIZE="${MIRROR_SIZE:-smallest}"

# --- Shutdown (stop_df) ---
# Seconds to wait for a save to flush after issuing quicksave.
SAVE_FLUSH_SECS="${SAVE_FLUSH_SECS:-3}"
# Seconds to wait for a graceful (SIGTERM) quit before escalating to SIGKILL.
STOP_TIMEOUT="${STOP_TIMEOUT:-15}"
