# df_fishbowl configuration
# Sourced as shell by bin/df_fishbowl. Override any value here.
# A user copy is searched for first at $XDG_CONFIG_HOME/df_fishbowl/config
# (or ~/.config/df_fishbowl/config); this file is the shipped default.

# --- Dwarf Fortress install ---
# Root of the extracted DF tree (contains the `dfhack` / `dfhack-run` launchers).
DF_HOME="${DF_HOME:-$HOME/DwarfFortressFishbowl/df_linux}"

# df-ai writes its narration here (df-ai.json -> write_log:true). Empty means
# "$DF_HOME/df-ai.log", resolved AFTER the user config is loaded, so a DF_HOME
# override there moves the log along with it. Set it explicitly only to follow a
# log that lives somewhere else.
LOG_FILE="${LOG_FILE:-}"

# --- Behaviour ---
# tmux session name holding the running DF process.
SESSION="${SESSION:-df_fishbowl}"

# Terminal emulator used to display the fortress / log.
#   Wayland backend expects a Wayland-native terminal (foot, kitty, alacritty).
#   X11 backend should set this to an X terminal (xterm, urxvt, st).
#
#   foot      - default, and the only terminal that can CENTER the mirrored
#               fortress on screens of very different sizes (its `pad` accepts
#               arbitrary values). Needs swaylock-plugin's wl_seat patch: foot
#               refuses to start when no seat is advertised.
#   alacritty - works with swaylock-plugin >= 1.8.7 (upstream forwards
#               wl_subcompositor). Its window.padding is a u8 (max 255px per
#               side), which is fine under FORTRESS_FIT=scale (the residual pad
#               is small) but NOT under FORTRESS_FIT=pad on very different
#               screens, where the pad is clamped and the fortress renders
#               off-centre (a WARNING lands in the render log).
#   havoc     - works even with an unpatched swaylock-plugin (single wl_shm
#               surface), but no font/centering options.
#   kitty     - DANGEROUS, DO NOT USE: its GL/EGL init crashes swaylock-plugin's
#               nested compositor, which ABANDONS the lock (sway shows its red
#               "lock failed" screen and the session is left unlocked).
TERMINAL="${TERMINAL:-foot}"

# Font for DF's FORTRESS terminal only, applied per-invocation (your global
# terminal config is untouched, and the log keeps its default font). DF in TEXT
# mode draws with the terminal font, so a SQUARE font renders its CP437 map with
# correct proportions — a normal 1:2 monospace looks vertically stretched.
# `unscii` (unscii-8, square, public domain) is a good fit; install.sh offers
# to fetch it, or install it by hand:
#   mkdir -p ~/.local/share/fonts && \
#   curl -fsSLo ~/.local/share/fonts/unscii-8.ttf http://viznut.fi/unscii/unscii-8.ttf && fc-cache -f
# Honored by foot, alacritty and kitty; empty = terminal default. Missing glyphs
# fall back to the system default font.
FORTRESS_FONT="${FORTRESS_FONT:-unscii}"
# Point size for FORTRESS_FONT (empty = terminal default). Larger = bigger tiles,
# fewer on screen. With FORTRESS_FIT=scale this is the size used on the SMALLEST
# fortress output; bigger screens scale up from it.
FORTRESS_FONT_SIZE="${FORTRESS_FONT_SIZE:-}"

# How to make every screen of a MIRRORED fortress (FORTRESS_MODE=single) show the
# same character grid — they share one tmux session, which is sized to the
# smallest attached client.
#   scale - (default) size the font per screen so all render the same grid with
#           proportionally bigger cells, then pad the remainder to centre it.
#           Fills the screen; glyphs stay square (no stretching). With foot the
#           cell is pinned to whole pixels (pixelsize + line-height), so the grid
#           is identical on every screen; other terminals scale a point size and
#           may end up a cell or two apart.
#   pad   - no scaling: inset every grid to the smallest screen's pixel box and
#           centre it. Exact, but a much bigger screen is mostly border (a
#           3840x2160 beside a 2133x1333 loses ~70% of its area), and the large
#           pad values exceed alacritty's u8 limit, so this is foot-only.
FORTRESS_FIT="${FORTRESS_FIT:-scale}"

# Which fortress output defines the shared grid (FORTRESS_FIT=scale):
#   largest  - (default) the BIGGEST screen sets the grid, so it fills exactly,
#              edge to edge, with the largest tiles; smaller screens scale down
#              and take the small leftover band instead. Best when your main
#              screen is the big one.
#   smallest - the SMALLEST screen fills exactly and bigger ones carry the
#              leftover band. Keeps the grid (and DF's tile count) modest.
# Glyph sizes do NOT change when you flip this: FORTRESS_BASE_FONT_SIZE is always
# the size on the smallest screen. Only which screen is pixel-perfect (and the
# grid's aspect ratio) changes.
FORTRESS_REF="${FORTRESS_REF:-largest}"

# Base point size FORTRESS_FIT=scale scales from when FORTRESS_FONT_SIZE is empty
# (we cannot read the terminal's own default, and scaling needs a known base).
# This is the MAIN TILE-SIZE DIAL: it is the size on the smallest fortress screen,
# and every other screen scales proportionally, so lowering it gives smaller tiles
# and a larger grid (more fortress visible) on ALL screens at once. With foot the
# size becomes a whole-pixel cell on the smallest screen (pt x 96/72, rounded:
# 7pt -> 9px, 9pt -> 12px, 12pt -> 16px), the reference screen's cell is that
# divided by its size ratio, and the grid is the reference's pixels divided by
# its cell. Nearby cell sizes (+-20%) are tried and the one that wastes the
# least area over all fortress screens wins, so the exact cell can differ a
# pixel or two from the dial. E.g. 2560x1600 laptop + 3840x2160 4K, base 7:
# 15px on the 4K and 10px on the laptop, grid 256x144 on both, laptop pad 0x80
# (the 16:9 vs 16:10 band). The render log prints the result.
# DF needs at least 80x25; the practical floor is set by the SMALLEST screen (it
# renders at the base size itself and gets squinty first).
FORTRESS_BASE_FONT_SIZE="${FORTRESS_BASE_FONT_SIZE:-9}"

# Scenery around the mirrored fortress (foot only, with FORTRESS_FIT=scale): the
# part of a screen the shared grid does not cover is drawn as a Dwarf Fortress
# cross section -- grass and trees above, raw stone with ore and gem veins at
# the sides and below, magma at the bottom, smoothed walls around the fort --
# by a per-output tmux session hosting the fortress in a borderless popup
# (lib/frame.sh). 0 = plain padded border in FORTRESS_BACKGROUND instead.
FORTRESS_FRAME="${FORTRESS_FRAME:-1}"
# Background colour (hex RGB, no #) of the fortress terminal: the sky in the
# scenery and the border without it. Black matches DF's own background; the
# terminal's configured background (often a grey) would show as a frame.
FORTRESS_BACKGROUND="${FORTRESS_BACKGROUND:-000000}"

# Percent chance (0-100) that a *new* fortress is generated instead of loading
# a random existing save.
NEW_FORT_CHANCE="${NEW_FORT_CHANCE:-10}"

# Saved fortresses whose folder is older than this many days are deleted before
# a new session starts (the special `current` folder is always kept).
SAVE_MAX_AGE_DAYS="${SAVE_MAX_AGE_DAYS:-30}"

# Hard cap on how many fortresses to keep, applied after the age sweep: the
# MAX_SAVES most recently played survive, the rest are deleted (least recently
# played first). 0 disables the cap. A fort is roughly 20-60MB and every new
# world adds one, so without a cap an unattended screensaver grows without
# bound (observed: 27 forts / 941MB in under two weeks at NEW_FORT_CHANCE=50).
# The world df-ai is currently pointed at is never pruned, and pruning is
# skipped entirely while DF is running.
MAX_SAVES="${MAX_SAVES:-10}"

# single = one DF process shared (mirrored) across all horizontal outputs.
# multi  = one independent DF process per horizontal output.
FORTRESS_MODE="${FORTRESS_MODE:-single}"

# Role assignment: portrait outputs show the log, landscape ones the fortress,
# and a lone output is always the fortress. When this is 1 and there is NO
# portrait output but two or more landscape ones, the smallest landscape shows
# the log and the larger ones the fortress. Set to 0 to make every landscape
# output a fortress in that case.
LOG_ON_SMALLER_HORIZONTAL="${LOG_ON_SMALLER_HORIZONTAL:-1}"

# Shared tmux grid for the mirrored fortress (FORTRESS_MODE=single):
#   smallest = session = the smallest screen's grid; nothing is ever cut off, and
#              a screen with a slightly larger grid shows a thin filler-dot band.
#   largest  = session = the biggest screen's grid; it fills, smaller screens are
#              cut off (clipped) on the missing rows/columns.
# `smallest` is the default because losing content (clipping) is worse than a few
# filler dots. FORTRESS_FIT/FORTRESS_REF already equalise the grids (by scaling
# the font and padding the remainder), so in practice the grids differ by only a
# cell or two and the filler band is thin. (Use FORTRESS_MODE=multi for an
# independent, natively-full fortress per screen with no shared grid at all.)
MIRROR_SIZE="${MIRROR_SIZE:-smallest}"

# --- Shutdown (stop_df) ---
# Seconds to wait for a save to flush after issuing quicksave.
SAVE_FLUSH_SECS="${SAVE_FLUSH_SECS:-3}"
# Seconds to wait for a graceful (SIGTERM) quit before escalating to SIGKILL.
STOP_TIMEOUT="${STOP_TIMEOUT:-15}"
# Seconds to wait for DF to answer a dfhack-run RPC (unpause / quicksave) before
# giving up on the save and stopping it anyway. A frozen DF never answers, and
# without this cap the stop blocked forever — DF then survived the unlock.
RPC_TIMEOUT="${RPC_TIMEOUT:-10}"
# Starts and stops are serialised. Seconds one waits for an in-flight stop/start
# to finish before proceeding regardless.
LIFECYCLE_LOCK_WAIT="${LIFECYCLE_LOCK_WAIT:-120}"
