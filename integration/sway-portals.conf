# User override of /usr/share/xdg-desktop-portal/sway-portals.conf (a matching
# file here REPLACES it, so the default line is repeated).
#
# Inhibit is disabled ON PURPOSE. xdg-desktop-portal-gtk implements
# org.freedesktop.portal.Inhibit without a GNOME session manager by creating an
# idle inhibitor on its own hidden GTK window. sway only honours inhibitors on
# VISIBLE surfaces, so that inhibitor does nothing — yet the portal reports
# success, so Firefox ("Playing video") believes it inhibited idle and never
# falls back to its native zwp_idle_inhibit_manager_v1 path. Result: swayidle
# locks the screen in the middle of a YouTube video. With no Inhibit backend the
# portal call fails, Firefox uses the Wayland inhibitor on its own window, and
# sway sees it (swaymsg -t get_tree: "inhibit_idle": true while a video plays).
[preferred]
default=wlr;gtk;
org.freedesktop.impl.portal.Inhibit=none;
