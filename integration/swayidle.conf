# swayidle integration for fishbowl
# ----------------------------------------
# swayidle has no config file; it is configured entirely on its command line.
# This file documents the timeout blocks to use. Use an ABSOLUTE path to the
# CLI, because swayidle does not inherit your interactive shell's PATH:
#
#   DFS="$HOME/.local/bin/fishbowl"
#
# Minimal standalone invocation (lock after 5 min, tear DF down on resume):
#
#   swayidle -w \
#       timeout 300 "$DFS lock" \
#       resume      "$DFS stop"
#
# `fishbowl lock` runs swaylock-plugin in the foreground: it starts the
# fortress, locks securely with the live view, and — on a correct password —
# quicksaves and stops DF before returning. The `resume` hook is a redundant
# safety net.
#
# --------------------------------------------------------------------------
# Folding into an existing swayidle (as on this machine) — REPLACE the plain
# swaylock lock timeout with fishbowl, and KEEP your other timeouts:
#
#   swayidle -w \
#       timeout 240 'brightnessctl -s && brightnessctl set 10' \
#                   resume 'brightnessctl -r' \
#       timeout 300 "$DFS lock" \                # <-- was: .../swaylock.sh
#                   resume "$DFS stop" \
#       timeout 600 'swaymsg "output * power off"' \
#                   resume 'swaymsg "output * power on"' \
#       timeout 900  '[ "$(acpi -b | grep Discharging)" != "" ] && systemctl suspend' \
#       timeout 3600 '[ "$(acpi -b | grep Discharging)" = "" ]  && systemctl suspend' \
#       before-sleep "$DFS stop"
#
# NOTE on the 600s `output * power off` block: while fishbowl is locked it
# is actively drawing the fortress, so this timeout will blank the display 300s
# later. Keep it if you want the screensaver to run for a while and then sleep
# the panel to save power; raise/remove it if you want the fortress to stay
# visible indefinitely while locked.
