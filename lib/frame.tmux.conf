# tmux config for the per-output "frame" server that surrounds the mirrored
# fortress (lib/frame.sh). Loaded with -f, so the user's ~/.tmux.conf is never
# read: the frame must look the same everywhere and must not inherit key
# bindings, status bars or plugins.
# Die with the terminal: the foot client is the only client, and when the lock
# ends and foot goes away the session, and with it the server (exit-empty is
# the default), must not linger as an orphan per output per lock.
set -g destroy-unattached on
set -g exit-empty on
# A screensaver: no status bar, no bells, nothing that is not fortress.
set -g status off
set -g bell-action none
set -g visual-bell off
set -g monitor-activity off
# The popup holding the fortress has no border; keep its style neutral so the
# inner terminal's colours show unchanged.
set -g popup-border-lines none
set -g popup-style default
